[workspace]
resolver = "2"
members = ["crates/protocol", "crates/domain", "crates/licensing", "crates/server", "crates/agent", "crates/windows-platform"]

[workspace.package]
edition = "2021"
rust-version = "1.97"
version = "0.1.0"
publish = false

[workspace.dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "serde"] }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.20"
punishell-protocol = { path = "crates/protocol" }
punishell-domain = { path = "crates/domain" }
punishell-licensing = { path = "crates/licensing" }
punishell-windows-platform = { path = "crates/windows-platform" }
tokio = { version = "=1.53.1", features = ["full"] }
clap = { version = "=4.5.53", features = ["derive"] }
sha2 = "=0.10.9"
argon2 = "=0.5.3"
aes-gcm = "=0.10.3"
totp-rs = { version = "=5.7.0", features = ["gen_secret"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
axum = "=0.8.7"
axum-server = { version = "=0.7.3", features = ["tls-rustls"] }
tower = { version = "=0.5.3", features = ["util"] }
tempfile = "=3.23.0"
futures-util = "=0.3.31"
semver = "=1.0.28"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Environment", "Win32_System_Services", "Win32_System_Shutdown", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust"] }
windows-service = "=0.8.1"
wmi = "=0.18.4"
zeroize = "=1.8.2"
fs2 = "=0.4.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
