<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PuniShell Rust</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body>
<header><h1>PuniShell Rust</h1><p>Administración autorizada de equipos</p><span id="identity"></span><button id="logout" hidden>Salir</button></header>
<main><p id="notice" role="status"></p>
<form id="login"><h2>Acceder</h2><label>Usuario<input name="username" required autocomplete="username"></label><label>Contraseña<input name="password" type="password" required autocomplete="current-password"></label><label>Código del autenticador<input name="totp" inputmode="numeric" pattern="[0-9]{6}" required autocomplete="one-time-code"></label><button>Entrar</button></form>
<section id="panel" hidden><nav><button data-view="overview">Resumen</button><button data-view="agents">Equipos</button><button data-view="commands">Solicitudes y resultados</button><button data-view="licenses">Licencias</button><button data-view="users">Usuarios</button><button data-view="audit">Auditoría</button></nav>
<section id="admin" hidden><h2>Administración</h2>
<form id="license-form"><h3>Emitir o renovar licencia</h3><label>Meses<input name="months" type="number" min="1" max="120" value="6" required></label><label>Plan<input name="plan" value="starter_6m" required></label><label>Cupo<input name="max_agents" type="number" min="1" max="10000" value="10" required></label><label>Gracia offline en horas<input name="offline_grace_hours" type="number" min="0" max="72" value="72" required></label><fieldset><legend>Funciones contratadas</legend><label><input type="checkbox" name="feature" value="inventory" checked>Inventario</label><label><input type="checkbox" name="feature" value="diagnostics" checked>Diagnóstico</label><label><input type="checkbox" name="feature" value="lock_workstation">Bloqueo</label><label><input type="checkbox" name="feature" value="manage_services">Servicios permitidos</label><label><input type="checkbox" name="feature" value="manage_bit_locker">BitLocker</label><label><input type="checkbox" name="feature" value="updates">Actualizaciones</label><label><input type="checkbox" name="feature" value="rotate_identity">Rotación de identidad</label></fieldset><button>Emitir licencia</button></form>
<form id="activation-form"><h3>Generar código de activación</h3><label>Validez en minutos<input name="ttl_minutes" type="number" min="1" max="1440" value="15" required></label><button>Generar</button></form>
<form id="user-form"><h3>Crear usuario</h3><label>Usuario<input name="username" required></label><label>Contraseña inicial<input name="password" type="password" minlength="14" required></label><label>Rol<select name="role"><option value="operator">Operador</option><option value="approver">Aprobador</option><option value="auditor">Auditor</option><option value="administrator">Administrador</option></select></label><button>Crear</button></form></section>
<section id="operator" hidden><form id="action-form"><h2>Solicitar una acción</h2><label>Equipo<select name="agent_id" id="agent-choice" required></select></label><label>Acción<select name="type" id="action-choice"><option value="collect_inventory">Actualizar inventario</option><option value="diagnostic_bundle">Diagnóstico</option><option value="lock_workstation">Bloquear sesión</option><option value="restart_managed_service">Reiniciar servicio permitido</option><option value="resume_bit_locker_protection">Reanudar protección BitLocker</option><option value="request_update">Actualizar agente</option><option value="rotate_agent_key">Rotar identidad</option></select></label><label>Servicio, canal o unidad<input name="parameter" id="action-parameter" placeholder="Ej.: C:"></label><button>Solicitar aprobación</button></form></section>
<div class="view-heading"><div><h2 id="view-title">Resumen operativo</h2><p id="view-subtitle">Estado actual de la flota y actividad reciente</p></div><button id="refresh">Actualizar</button></div><div id="records"></div>
<form id="password-form"><h2>Cambiar contraseña</h2><label>Actual<input name="old_password" type="password" required></label><label>Nueva<input name="new_password" type="password" minlength="14" required></label><label>TOTP nuevo<input name="totp" pattern="[0-9]{6}" required></label><button>Cambiar y cerrar sesiones</button></form>
</section></main></body></html>
